<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ponte en contacto con el Radio Club Rioja. Email: ea1rcr@ure.es. Visítanos en C/ Belchite, s/n, 26003 Logroño.">
    <meta property="og:title" content="Contacto • EA1RCR">
    <meta property="og:description" content="Ponte en contacto con el Radio Club Rioja. Email: ea1rcr@ure.es. Visítanos en C/ Belchite, s/n, 26003 Logroño.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ea1rcr.netlify.app/contacto.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Contacto • EA1RCR</title>
{{head}}
@@ACTIVE_PAGE=6@@
{{header}}

    <!-- Hero con banner -->

    <div class="max-w-screen-xl mx-auto px-8 py-16">
        <div class="max-w-2xl">
            <h1 class="text-5xl font-semibold tracking-tight">Contacto</h1>
            <p class="mt-4 text-lg text-slate-600">¿Tienes alguna pregunta o quieres ponerte en contacto con nosotros?</p>

            <!-- Formulario de contacto -->
            <form name="contacto" method="POST" netlify class="mt-10 space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nombre</label>
                        <input type="text" name="nombre" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:border-red-300 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                        <input type="email" name="email" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:border-red-300 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Mensaje</label>
                    <textarea name="mensaje" rows="6" required
                              class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:border-red-300 transition-colors resize-y"></textarea>
                </div>

                <button type="submit"
                        class="inline-flex items-center px-8 py-4 bg-slate-900 hover:bg-black text-white rounded-2xl font-medium transition-colors">
                    Enviar mensaje
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-slate-200">
                <div class="grid md:grid-cols-2 gap-8">
                    <div>
                        <div class="text-sm text-slate-500">Email</div>
                        <a href="mailto:ea1rcr@ure.es" class="text-xl font-medium">ea1rcr@ure.es</a>
                    </div>
                    <div>
                        <div class="text-sm text-slate-500">Dirección</div>
                        <div class="text-xl font-medium">C/ Belchite, s/n<br>26003 Logroño</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

{{footer}}
</body>
</html>
