<body class="bg-slate-50">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-screen-xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <img src="logo.png" alt="EA1RCR" class="h-10 w-auto">
                <div>
                    <span class="font-semibold text-xl tracking-tight">EA1RCR</span>
                    <span class="text-slate-500 text-sm block -mt-1">Radio Club Rioja</span>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-x-8 text-sm">
                <a href="index.html" class="@@ACTIVE_DESKTOP_0@@">Inicio</a>
                <a href="el-club.html" class="@@ACTIVE_DESKTOP_1@@">El Club</a>
                <a href="sede.html" class="@@ACTIVE_DESKTOP_2@@">Sede</a>
                <a href="junta.html" class="@@ACTIVE_DESKTOP_3@@">Junta</a>
                <a href="cursos.html" class="@@ACTIVE_DESKTOP_4@@">Cursos</a>
                <a href="noticias.html" class="@@ACTIVE_DESKTOP_5@@">Noticias</a>
                <a href="contacto.html" class="@@ACTIVE_DESKTOP_6@@">Contacto</a>
            </div>
        </div>
    </nav>
    <!-- Menú móvil -->
    <div class="md:hidden fixed top-4 right-4 z-[60]">
        <button id="menu-toggle" class="p-2 rounded-lg bg-white shadow-lg hover:bg-slate-100 transition-colors" aria-label="Abrir menú de navegación" tabindex="0">
            <i class="fa-solid fa-bars text-xl" aria-hidden="true"></i>
        </button>
    </div>
    <div id="mobile-menu" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-label="Menú de navegación">
        <div class="absolute top-0 right-0 h-full w-72 bg-white shadow-2xl p-6">
            <div class="flex justify-between items-center mb-8">
                <span class="font-semibold text-lg">Menú</span>
                <button id="menu-close" onclick="document.getElementById('mobile-menu').classList.add('hidden')" class="p-2 rounded-lg hover:bg-slate-100 transition-colors" aria-label="Cerrar menú">
                    <i class="fa-solid fa-xmark text-xl" aria-hidden="true"></i>
                </button>
            </div>
            <nav class="space-y-1">
                <a href="index.html" class="@@ACTIVE_MOBILE_0@@" onclick="toggleMobileMenu(false)">Inicio</a>
                <a href="el-club.html" class="@@ACTIVE_MOBILE_1@@" onclick="toggleMobileMenu(false)">El Club</a>
                <a href="sede.html" class="@@ACTIVE_MOBILE_2@@" onclick="toggleMobileMenu(false)">Sede</a>
                <a href="junta.html" class="@@ACTIVE_MOBILE_3@@" onclick="toggleMobileMenu(false)">Junta</a>
                <a href="cursos.html" class="@@ACTIVE_MOBILE_4@@" onclick="toggleMobileMenu(false)">Cursos</a>
                <a href="noticias.html" class="@@ACTIVE_MOBILE_5@@" onclick="toggleMobileMenu(false)">Noticias</a>
                <a href="contacto.html" class="@@ACTIVE_MOBILE_6@@" onclick="toggleMobileMenu(false)">Contacto</a>
            </nav>
        </div>
    </div>
    <script>
    var menuToggle = document.getElementById('menu-toggle');
    var mobileMenu = document.getElementById('mobile-menu');
    if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', function() { mobileMenu.classList.toggle('hidden'); });
        mobileMenu.addEventListener('click', function(e) { if (e.target === mobileMenu) mobileMenu.classList.add('hidden'); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) mobileMenu.classList.add('hidden'); });
    }
    function toggleMobileMenu(h) { if (h===false) document.getElementById('mobile-menu').classList.add('hidden'); }
    </script>
